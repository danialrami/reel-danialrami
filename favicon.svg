<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="32" height="32" fill="#111111"/>
    
    <!-- Outer tape path -->
    <rect x="4" y="15" width="24" height="4" fill="#78BEBA"/>
    <rect x="4" y="15" width="24" height="1" fill="#E7B225"/>
    
    <!-- Left reel (spool) -->
    <circle cx="10" cy="12" r="6" fill="none" stroke="#78BEBA" stroke-width="1.5"/>
    <circle cx="10" cy="12" r="3" fill="#111111" stroke="#E7B225" stroke-width="1"/>
    <circle cx="10" cy="12" r="1" fill="#E7B225"/>
    
    <!-- Right reel (spool) -->
    <circle cx="22" cy="12" r="6" fill="none" stroke="#78BEBA" stroke-width="1.5"/>
    <circle cx="22" cy="12" r="3" fill="#111111" stroke="#E7B225" stroke-width="1"/>
    <circle cx="22" cy="12" r="1" fill="#E7B225"/>
    
    <!-- Tape between reels -->
    <rect x="13" y="12" width="6" height="2" fill="#D35233"/>
    
    <!-- Bottom detail pixels -->
    <rect x="8" y="24" width="2" height="2" fill="#78BEBA"/>
    <rect x="12" y="24" width="2" height="2" fill="#2069af"/>
    <rect x="18" y="24" width="2" height="2" fill="#2069af"/>
    <rect x="22" y="24" width="2" height="2" fill="#78BEBA"/>
</svg>